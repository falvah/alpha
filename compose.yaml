services:
  cabinet:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SANDBOX_MODE: ${SANDBOX_MODE:-${DEMO_MODE:-true}}
      DEBUG: ${DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      SECRET_KEY: ${SECRET_KEY:-}
      DATA_DIR: /app/.data
    volumes:
      - cabinet_data:/app/.data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
volumes:
  cabinet_data:
