# Экспертная скоринговая карта кредитного риска МСБ.
# Баллы указаны в единицах логита: положительный балл повышает риск,
# отрицательный — снижает. PD = sigmoid(intercept + сумма баллов).
# Все границы бинов: [min, max), верхняя граница не включается.
# Карта — черновик для калибровки риск-подразделением: веса и пороги
# обязательно пересчитать на исторических дефолтах.

version: "1.0.0"
name: "Экспертная карта кредитного риска МСБ"
updated: "2026-10-22"

model:
  intercept: -2.50

policy:
  currency: "RUB"
  min_amount: 100000
  max_amount: 30000000
  min_term_months: 3
  max_term_months: 60

  # PD — оценка вероятности дефолта за 12 месяцев.
  max_pd: 0.12          # выше — отказ (review_pd: null — серой зоны нет)
  review_pd: null       # например 0.20, если нужна ручная доработка
  min_coverage: 0.65    # минимальная доля заполненных факторов (по весам)

  # Без этих проверок одобрение невозможно: "пусто" — это не "нет".
  # Список можно сузить, если проверки выполняются отдельным процессом.
  critical_features:
    - address_mass
    - address_unreliable
    - director_disqualified
    - director_mass
    - nominal_owner

  # Доступность обслуживания долга: платёж / доход.
  pti_limit: 0.45
  inflow_haircut: 0.80  # поступления — не прибыль, консервативный дисконт

  # Ставка = базовая + премия за PD − дисконт за залог.
  base_rate: 20.0
  reference_rate: 24.0  # для проверки PTI до расчёта финальной ставки
  min_rate: 15.0
  max_rate: 35.0
  rate_rounding: 0.5
  amount_rounding: 10000

  rate_grid:
    - {max_pd: 0.02, premium: 1.5}
    - {max_pd: 0.04, premium: 2.5}
    - {max_pd: 0.06, premium: 3.5}
    - {max_pd: 0.08, premium: 4.5}
    - {max_pd: 0.10, premium: 5.5}
    - {max_pd: 0.12, premium: 6.5}
    - {max_pd: 0.20, premium: 9.0}
    - {max_pd: 1.00, premium: 14.0}

  collateral_ltv:
    недвижимость: 0.70
    транспорт: 0.50
    оборудование: 0.40
    прочее: 0.25
  collateral_ltv_default: 0.25

  collateral_discount:
    недвижимость: 1.0
    транспорт: 0.75
    оборудование: 0.5
    прочее: 0.25

# Без этих признаков решение не принимается (отказ MISSING_REQUIRED_DATA).
required_features:
  all:
    - months_since_registration
    - has_credit_history
  mature:
    - months_with_inflows
    - avg_monthly_inflow
  young: []

# Жёсткие стоп-факторы: срабатывание = отказ независимо от баллов.
hard_stops:
  - id: address_mass
    code: ADDRESS_MASS
    title: "Адрес массовой регистрации"
    when: {field: address_mass, op: eq, value: true}

  - id: address_unreliable
    code: ADDRESS_UNRELIABLE
    title: "Недостоверный адрес"
    when: {field: address_unreliable, op: eq, value: true}

  - id: director_disqualified
    code: DIRECTOR_DISQUALIFIED
    title: "Дисквалифицированный руководитель"
    when: {field: director_disqualified, op: eq, value: true}

  - id: director_mass
    code: DIRECTOR_MASS
    title: "Массовый руководитель"
    when: {field: director_mass, op: eq, value: true}

  - id: nominal_owner
    code: NOMINAL_OWNER
    title: "Номинальный владелец"
    when: {field: nominal_owner, op: eq, value: true}

  - id: critical_overdue
    code: CRITICAL_OVERDUE
    title: "Просрочка более 90 дней за 12 месяцев"
    when: {field: max_overdue_12m, op: gt, value: 90}

  - id: mass_management
    code: MASS_MANAGEMENT
    title: "Более 20 юрлиц у руководителя"
    when: {field: companies_per_director, op: gt, value: 20}

  - id: no_inflow
    code: NO_INFLOW
    title: "Нулевые поступления по счёту"
    when:
      all:
        - {field: branch, op: eq, value: mature}
        - {field: avg_monthly_inflow, op: lte, value: 0}

  - id: young_unsecured
    code: YOUNG_UNSECURED
    title: "Молодая компания без поручительства и достаточного залога"
    when:
      all:
        - {field: branch, op: eq, value: young}
        - {field: guarantee_present, op: ne, value: true}
        - any:
            - {field: collateral_coverage, op: is_null}
            - {field: collateral_coverage, op: lt, value: 1.0}

