{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Страницы">{% if page.has_previous %}<a class="button secondary small-button" href="?page={{ page.previous_page_number }}&amp;status={{ selected_status|urlencode }}&amp;q={{ query|urlencode }}&amp;view={{ request.GET.view|urlencode }}&amp;mine={{ request.GET.mine|urlencode }}">← Назад</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button secondary small-button" href="?page={{ page.next_page_number }}&amp;status={{ selected_status|urlencode }}&amp;q={{ query|urlencode }}&amp;view={{ request.GET.view|urlencode }}&amp;mine={{ request.GET.mine|urlencode }}">Далее →</a>{% endif %}</nav>{% endif %}
